# SuperHero Registry: the whole system with one command (T15). No .NET SDK or Node.js needed.
#
#   cp .env.example .env    # then set SA_PASSWORD and JWT__KEY
#   docker compose up --build -d
#
#   UI   http://localhost:8080   (nginx: the Angular app, with /api proxied to the API)
#   API  http://localhost:5080   (direct access, for example /health)
#
# The API creates the database, applies the migrations and seeds the demo data on startup (T03, T03.1),
# so there is no manual database step. Data survives restarts in the sqlserver-data volume;
# `docker compose down -v` deletes it.

name: hero-registry

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env (see .env.example)}
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    # For SQL tools on this machine only (bound to 127.0.0.1, never exposed on the network).
    ports:
      - "127.0.0.1:14333:1433"
    healthcheck:
      # $$ keeps the variable for the container's shell instead of compose interpolation.
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./HeroRegistry
      dockerfile: src/HeroRegistry.Api/Dockerfile
    image: hero-registry-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__HeroRegistryDb: >-
        Server=sqlserver,1433;Database=HeroRegistryDb;User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      # Required: the API refuses to start without a key of at least 32 bytes (T08).
      Jwt__Key: ${JWT__KEY:?Set JWT__KEY in .env (at least 32 bytes, see .env.example)}
      # Empty disables Application Insights (T02.2). Never set a placeholder: an invalid value stops the API.
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      OTEL_SERVICE_NAME: hero-registry-api
    ports:
      - "5080:8080"
    healthcheck:
      # /health is anonymous in every environment and includes the SQL Server check (T11). The runtime
      # image has no curl, so the probe speaks HTTP over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ui:
    build:
      context: ./hero-registry-ui
    image: hero-registry-ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  sqlserver-data:

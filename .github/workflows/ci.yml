# CI (T16): build and test the back end and the front end on every push to main and every pull request.
# Then, only when both pass, build the Docker images and smoke-test the whole stack with Docker Compose.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to the same pull request cancels the run in progress; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NG_CLI_ANALYTICS: false

jobs:
  backend:
    name: Back end (.NET build and tests)
    # ubuntu-latest has Docker, which the integration tests need (Testcontainers starts SQL Server).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # setup-dotnet's own cache needs packages.lock.json files; this keys on the central package versions.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('HeroRegistry/Directory.Packages.props', 'HeroRegistry/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore HeroRegistry/HeroRegistry.slnx

      # src/ treats warnings as errors, so a new warning fails the build here too.
      - name: Build
        run: dotnet build HeroRegistry/HeroRegistry.slnx -c Release --no-restore

      # Unit and integration tests (Testcontainers SQL Server, WebApplicationFactory), with coverage.
      # Microsoft.Testing.Platform is enabled by the repository's global.json, hence --solution.
      # One Cobertura file per test project lands in TestResults/ (explicit, so the upload finds it).
      - name: Test
        run: >-
          dotnet test --solution HeroRegistry/HeroRegistry.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory TestResults

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Front end (Angular lint, build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hero-registry-ui
    steps:
      - uses: actions/checkout@v7

      # Angular 22 needs Node ^22.22.3; "22" resolves to the latest 22.x.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hero-registry-ui/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Vitest, single run, with the coverage thresholds (80% lines and branches): below them, it fails.
      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: hero-registry-ui/coverage/
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker images and Compose smoke test
    # Only once the code is known to be good: no point building images of a failing commit.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Throwaway secrets for this run only, masked in the logs. Compose refuses to start without them.
      - name: Generate throwaway secrets
        run: |
          sa_password="Ci-$(openssl rand -hex 16)Aa1!"
          jwt_key="$(openssl rand -base64 48)"
          echo "::add-mask::$sa_password"
          echo "::add-mask::$jwt_key"
          {
            echo "SA_PASSWORD=$sa_password"
            echo "JWT__KEY=$jwt_key"
          } >> "$GITHUB_ENV"

      - name: Build images
        run: docker compose build

      # --wait returns once SQL Server and the API report healthy (the UI waits for the API).
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test
        run: |
          set -euo pipefail
          echo "API health:"
          curl -fsS http://localhost:5080/health
          echo
          echo "UI serves the app, including a deep link (SPA fallback):"
          curl -fsS http://localhost:8080/ | grep -q '<app-root'
          curl -fsS http://localhost:8080/heroes/1 | grep -q '<app-root'
          echo "Sign in through nginx (the same origin as the browser) and list the seeded heroes:"
          token="$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"userName":"Admin","password":"Admin"}' \
            http://localhost:8080/api/auth/login | jq -r '.accessToken')"
          count="$(curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/api/heroes | jq '.totalCount')"
          echo "Seeded heroes: $count"
          test "$count" -ge 3

      - name: Show container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v
